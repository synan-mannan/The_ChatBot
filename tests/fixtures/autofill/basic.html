<!doctype html>
<html><body>
  <form>
    <label>Given name <input name="first_name" required></label>
    <label>Family name <input name="last_name" required></label>
    <label>Email address <input type="email" name="email" required></label>
    <label>Mobile no. <input type="tel" name="mobile" required></label>
    <label>LinkedIn Profile <input name="linkedin"></label>
    <label>Resume/CV <input type="file" name="resume" aria-label="Resume/CV"></label>
    <button type="submit">Submit application</button>
  </form>
</body></html>
